name: HarmonyOS HAP (experimental)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harmonyos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache/restore@v4
        id: pub-cache
        with:
          path: ~/.pub-cache
          key: ohos-pub-${{ hashFiles('pubspec.lock', '.github/workflows/harmonyos.yml') }}
          restore-keys: ohos-pub-
      - uses: ErBWs/setup-ohos@v2.0.0
        with:
          version: 26.0.0.821
          cache: true
      - name: Install Flutter for OpenHarmony
        run: |
          set -euo pipefail
          git clone --depth 1 -b '3.44.9+ohos-0.0.1-canary1' https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TOOL_CACHE/flutter-ohos"
          git -C "$RUNNER_TOOL_CACHE/flutter-ohos" tag 3.44.10
          curl -fsSL https://raw.githubusercontent.com/libo0118/FlClash-ohos/e1be0a8a615e0a2829f3bc46d7a4042ca189823e/.github/flutter_ohos.patch -o "$RUNNER_TEMP/flutter_ohos.patch"
          git -C "$RUNNER_TOOL_CACHE/flutter-ohos" apply "$RUNNER_TEMP/flutter_ohos.patch"
          echo "$RUNNER_TOOL_CACHE/flutter-ohos/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TOOL_CACHE/flutter-ohos/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
      - name: Select OHOS plugin implementations
        run: |
          set -euo pipefail
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            device_info_plus:
              git:
                url: https://github.com/tljk/plus_plugins.git
                path: packages/device_info_plus/device_info_plus
                ref: main
            package_info_plus:
              git:
                url: https://github.com/tljk/plus_plugins.git
                path: packages/package_info_plus/package_info_plus
                ref: main
            connectivity_plus:
              git:
                url: https://github.com/tljk/plus_plugins.git
                path: packages/connectivity_plus/connectivity_plus
                ref: main
            path_provider:
              git:
                url: https://gitcode.com/openharmony-tpc/flutter_packages.git
                path: packages/path_provider/path_provider
                ref: br_path_provider-v2.1.5_ohos
            shared_preferences:
              git:
                url: https://gitcode.com/openharmony-tpc/flutter_packages.git
                path: packages/shared_preferences/shared_preferences
                ref: br_shared_preferences-v2.5.3_ohos
            url_launcher:
              git:
                url: https://gitcode.com/openharmony-tpc/flutter_packages.git
                path: packages/url_launcher/url_launcher
                ref: br_url_launcher-v6.3.2_ohos
            image_picker:
              git:
                url: https://gitcode.com/openharmony-tpc/flutter_packages.git
                path: packages/image_picker/image_picker
                ref: br_image_picker-v1.2.1_ohos
            app_links:
              git:
                url: https://gitcode.com/CPF-Flutter/fluttertpc_app_links.git
                path: app_links
                ref: br_v7.0.0_ohos
            mobile_scanner:
              git:
                url: https://github.com/tljk/mobile_scanner.git
                ref: v7.4.0-fix-ohos
            flutter_js:
              git:
                url: https://github.com/tljk/flutter_js.git
                ref: master
            file_picker:
              git:
                url: https://github.com/tljk/flutter_file_picker.git
                ref: v12.0.0-beta.7-fix-ohos
            share_plus: 13.3.1
            dynamic_color:
              git:
                url: https://gitcode.com/CPF-Flutter/fluttertpc_dynamic_color.git
                path: packages/dynamic_color
                ref: dev
            flutter_inappwebview:
              git:
                url: https://gitcode.com/openharmony-sig/flutter_inappwebview.git
                path: flutter_inappwebview
                ref: a281ae3272a9218760d52b95014a71a41866bd6c
            win32: ^6.0.1
            win32_registry: 3.0.3
            flutter_rust_bridge: 2.12.0
          YAML
      - name: Create HarmonyOS target and resolve packages
        run: |
          set -euo pipefail
          exec > >(tee -a setup-ohos.log) 2>&1
          flutter --version
          flutter create --platforms=ohos --org=com.github.molchuan --project-name=fluxdo --no-pub .
          python3 tool/prepare_ohos_identity.py
          mkdir -p assets/certs
          python3 tool/prepare_ohos_network.py --stage before-pub-get
          python3 tool/prepare_ohos_media.py before-pub-get
          python3 tool/prepare_ohos_images.py --stage before-pub-get
          # The pinned video plugin has LFS example movies; they are not application assets.
          GIT_LFS_SKIP_SMUDGE=1 flutter pub get 2>&1 | tee pub-get-ohos.log
          dart tool/project_prep.dart test
          python3 tool/prepare_ohos_network.py --stage after-pub-get
          python3 tool/prepare_ohos_storage.py
          python3 tool/prepare_ohos_media.py after-pub-get
          python3 tool/prepare_ohos_images.py --stage after-pub-get
          python3 tool/prepare_ohos_webview.py
          python3 tool/prepare_ohos_transcode.py
          python3 tool/prepare_ohos_files.py
          python3 tool/prepare_ohos_notifications.py
          python3 tool/prepare_ohos_links.py
      - name: Validate protected storage and system capability contracts
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ohos-tests" --no-save --ignore-scripts typescript@6.0.3
          python3 tool/prepare_ohos_network.py --self-test
          python3 tool/prepare_ohos_storage.py --self-test
          python3 tool/prepare_ohos_media.py --self-test
          python3 tool/prepare_ohos_images.py --self-test
          python3 tool/prepare_ohos_transcode.py --self-test
          python3 tool/prepare_ohos_files.py --self-test
          python3 tool/prepare_ohos_notifications.py --self-test
          python3 tool/prepare_ohos_webview.py --self-test
          python3 tool/prepare_ohos_links.py --self-test
          node tool/test_ohos_secure_storage.mjs "$RUNNER_TEMP/ohos-tests/node_modules/typescript" "$GITHUB_WORKSPACE" 2>&1 | tee storage-ohos.log
          node tool/test_ohos_transcode.mjs "$RUNNER_TEMP/ohos-tests/node_modules/typescript" "$GITHUB_WORKSPACE" 2>&1 | tee transcode-ohos.log
          node tool/test_ohos_files.mjs "$RUNNER_TEMP/ohos-tests/node_modules/typescript" "$GITHUB_WORKSPACE" 2>&1 | tee files-ohos.log
          node tool/test_ohos_notifications.mjs "$RUNNER_TEMP/ohos-tests/node_modules/typescript" "$GITHUB_WORKSPACE" 2>&1 | tee notifications-ohos.log
          node tool/test_ohos_webview.mjs "$RUNNER_TEMP/ohos-tests/node_modules/typescript" "$GITHUB_WORKSPACE" 2>&1 | tee webview-ohos.log
      - name: Compile the actual OHOS network libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qy cmake make perl pkg-config clang llvm libclang-dev meson ninja-build nasm
          bash -n tool/ohos_native_env.sh tool/build_ohos_network.sh
          bash tool/build_ohos_network.sh 2>&1 | tee network-ohos.log
      - name: Compile and test the actual OHOS image libraries
        run: |
          set -euo pipefail
          bash -n tool/build_ohos_images.sh
          bash tool/build_ohos_images.sh 2>&1 | tee image-ohos.log
      - name: Apply scoped OHOS compatibility patches and test
        run: |
          set -euo pipefail
          python3 tool/prepare_ohos_app.py
          python3 tool/prepare_ohos_enums.py --self-test
          python3 tool/prepare_ohos_enums.py
          dart test/services/cf_challenge_fallback_policy_check.dart 2>&1 | tee cf-fallback-ohos.log
          flutter test --no-pub test/services/system_proxy_detector_test.dart test/services/network/cookie/raw_cookie_writer_fallback_test.dart test/image_transfer_utils_test.dart test/services/notification_tap_queue_test.dart test/services/message_bus_ohos_background_test.dart test/services/ohos_webview_trust_test.dart test/services/network/cookie/ohos_cookie_boundary_test.dart test/services/ohos_update_service_test.dart 2>&1 | tee tests-ohos.log
          dart test packages/enhanced_cookie_jar/test/guarded_cookie_save_test.dart 2>&1 | tee cookie-queue-ohos.log
      - name: Compile the original Flutter application to HAP
        run: |
          set -euo pipefail
          flutter build hap --release --no-codesign --no-pub 2>&1 | tee build-ohos.log
          mkdir -p dist
          find ohos/entry/build -type f -name '*.hap' -exec cp '{}' dist/ \;
          test -n "$(find dist -maxdepth 1 -name '*.hap' -print -quit)"
          printf 'Source: %s\nSigning: unsigned\nStatus: experimental; device, login and native feature validation pending\n' "$GITHUB_SHA" > dist/BUILD-INFO.txt
          printf 'Bundle: com.github.molchuan.cfluxdo\nName: cfluxdo\nIcon: original default classic PNG\nCompatibility: generated API18 minimum; WebView MITM API20+, native cookie metadata API23+\n' >> dist/BUILD-INFO.txt
          cp HARMONYOS.md dist/HARMONYOS.md
          git -C "$RUNNER_TOOL_CACHE/flutter-ohos" rev-parse HEAD >> dist/BUILD-INFO.txt
          cp pubspec.lock dist/pubspec.lock
          sha256sum dist/*.hap > dist/SHA256SUMS
      - name: Upload unsigned experimental HAP
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-ohos-unsigned-experimental
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Collect build diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          for log in setup-ohos.log pub-get-ohos.log storage-ohos.log transcode-ohos.log files-ohos.log notifications-ohos.log webview-ohos.log network-ohos.log image-ohos.log tests-ohos.log cf-fallback-ohos.log cookie-queue-ohos.log build-ohos.log; do
            if [ -f "$log" ]; then
              printf '\n### %s\n\n```text\n' "$log" >> "$GITHUB_STEP_SUMMARY"
              tail -n 100 "$log" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          git diff --binary > diagnostics/generated-source.patch
          cp pubspec_overrides.yaml diagnostics/ 2>/dev/null || true
          cp pubspec.lock diagnostics/ 2>/dev/null || true
          cp *-ohos.log diagnostics/ 2>/dev/null || true
          if [ -d work/network-port ]; then
            mkdir -p diagnostics/network
            cp work/network-port/*.readelf.txt work/network-port/*.symbols.txt work/network-port/BUILD-INFO.txt diagnostics/network/ 2>/dev/null || true
          fi
          if [ -d work/image-port ]; then
            mkdir -p diagnostics/images
            cp work/image-port/*.readelf.txt work/image-port/*.symbols.txt work/image-port/BUILD-INFO.txt diagnostics/images/ 2>/dev/null || true
          fi
          if [ -d ohos ]; then tar --exclude='node_modules' --exclude='oh_modules' --exclude='build' -czf diagnostics/ohos-project.tar.gz ohos; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fluxdo-ohos-build-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always() && steps.pub-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}
