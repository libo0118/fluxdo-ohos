name: Publish verified upstream 1.1.0 merge (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream-110
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'libo0118/fluxdo-ohos'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the reviewed exact merge tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          FORK=f956de9b4dee103409e6d4e925a522ff232a2282
          UPSTREAM=3e5f61b3e43651d23d2aca187b45a6405202d911
          EXPECTED=52d25ddcd554acdce0ba1bcedd023d09fe744177
