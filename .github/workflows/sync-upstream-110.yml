          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git merge-base --is-ancestor "$FORK" "$BASE"
          git diff --name-only "$FORK" "$BASE" > "$RUNNER_TEMP/preparation-changes.txt"
          python3 - "$RUNNER_TEMP/preparation-changes.txt" <<'PY'
          import pathlib, sys
          actual=set(pathlib.Path(sys.argv[1]).read_text().splitlines())
          expected={'.github/workflows/harmonyos.yml','.github/workflows/sync-upstream-110.yml'}
          assert actual == expected, sorted(actual)
